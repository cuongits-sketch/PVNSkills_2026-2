# ==============================================================================
#  tasks/webserver.yml
#  Danh sach TASK DUNG CHUNG de cau hinh may chu web (Nginx + /opt/wwwroot).
#  Duoc "import" boi CA HAI playbook:
#    - site.yml              (cau hinh ca web01 va web02 - dung hang ngay)
#    - configure-web02.yml   (CHI web02 - dung file nay DE CHAM DIEM, khong
#                              duoc sua doi theo yeu cau de thi)
#
#  Tach rieng task ra file nay giup KHONG LAP LAI logic giua 2 playbook -
#  chi co DUY NHAT MOT noi dinh nghia "may chu web can duoc cau hinh nhu the nao".
# ==============================================================================
---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure /opt/wwwroot exists with correct ownership
  file:
    path: /opt/wwwroot
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy homepage content
  copy:
    dest: /opt/wwwroot/main.html
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="utf-8">
          <title>PVNSkills DMZ</title>
      </head>
      <body>
          <h1>PVNSkills DMZ Portal</h1>
          <p>7ecb4e033421b96f88e2111fe97cdad4ddceacc6</p>
      </body>
      </html>
    owner: www-data
    group: www-data
    mode: "0644"

- name: Deploy custom 404 page
  copy:
    dest: /opt/wwwroot/404.html
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="utf-8">
          <title>404</title>
      </head>
      <body>
          <h1>Sorry, but something went wrong</h1>
      </body>
      </html>
    owner: www-data
    group: www-data
    mode: "0644"

- name: Deploy Nginx site configuration from template
  template:
    src: templates/web.conf.j2
    dest: /etc/nginx/sites-available/web.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable web site config
  file:
    src: /etc/nginx/sites-available/web.conf
    dest: /etc/nginx/sites-enabled/web.conf
    state: link
  notify: Reload nginx

- name: Disable default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure Nginx is running and enabled at boot
  service:
    name: nginx
    state: started
    enabled: true
